<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekordni skoki elitnih atletov</title>
<style>
  body {
    font-family: Verdana, sans-serif;
    background-color: khaki;
    padding: 20px;
  }

  h2 { text-align: center; }
  h4 { text-align: center; color: #555; margin: 5px 0 25px; }

  /* Ovojnica za horizontalno pomikanje na majhnih zaslonih */
  .tabela-scroll { overflow-x: auto; }

  table {
    border-collapse: collapse;
    border: 1px solid black;
    margin: 0 auto;
    background: #fff;
  }

  th, td {
    border: 1px solid black;
    padding: 8px;
    text-align: center;
  }

  th { background: #333; color: #fff; }

  /* ===== Klikabilni predogled videa ===== */
  .video-gumb {
    position: relative;
    width: 240px;
    height: 180px;
    cursor: pointer;
    border: 2px solid #444;
    border-radius: 8px;
    overflow: hidden;
    background: #222;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  }

  .video-gumb:hover {
    transform: scale(1.04);
    box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    border-color: #e60000;
  }

  .video-gumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Rdeč gumb Predvajaj */
  .predvajaj {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 56px; height: 40px;
    background: rgba(230,0,0,0.85);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }
  .video-gumb:hover .predvajaj { background: #ff0000; }

  .predvajaj::after {
    content: "";
    border-left: 16px solid white;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    margin-left: 4px;
  }

  .oznaka {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 11px;
    padding: 3px 6px;
  }

  /* ===== MODALNO OKNO ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.odprt { display: flex; animation: pojavi 0.25s ease; }

  @keyframes pojavi {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .modal-okvir {
    background: #222;
    border-radius: 10px;
    width: min(90vw, 720px);
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  }

  .modal-glava {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 15px;
    background: #333;
    color: #fff;
    font-weight: bold;
  }

  .modal-zapri {
    background: #e74c3c;
    color: white;
    border: none;
    font-size: 22px;
    line-height: 1;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
  }
  .modal-zapri:hover { background: #c0392b; }

  /* Video v razmerju 4:3 (kot originalni 480×360) */
  .modal-video { aspect-ratio: 4/3; }
  .modal-video iframe {
    width: 100%; height: 100%;
    border: 0; display: block;
  }
</style>
</head>
<body>

<h2>Rekordni skoki elitnih atletov</h2>
<h4>Družina Prezelj (Stanka, Dušan, Rožle)</h4>

<div class="tabela-scroll">
  <div id="tabela"></div>
</div>

<!-- MODALNO OKNO -->
<div class="modal-overlay" id="modal" onclick="klikOverlay(event)">
  <div class="modal-okvir">
    <div class="modal-glava">
      <span id="modalNaslov"></span>
      <button class="modal-zapri" onclick="zapriModal()" title="Zapri">&times;</button>
    </div>
    <div class="modal-video" id="modalVideo"></div>
  </div>
</div>

<script>
// Seznam video posnetkov (vrstice po dva, kot v originalni tabeli)
const videi = [
  [
    { ime: "Dušan Prezelj 215", url: "https://www.youtube.com/embed/llPnJUx8ufg" },
    { ime: "Dušan Prezelj 176", url: "https://www.youtube.com/embed/eD3_FgSpXBQ" }
  ],
  [
    { ime: "Dušan Prezelj 168", url: "https://www.youtube.com/embed/oODftPxq38w" },
    { ime: "Dušan Prezelj 167", url: "https://www.youtube.com/embed/qRLOEMIJ4vc" }
  ],
  [
    { ime: "Dušan Prezelj 160", url: "https://www.youtube.com/embed/iN4uF73Cpeg" },
    { ime: "Dušan Prezelj 145", url: "https://www.youtube.com/embed/I1Hza3OQ1Ig" }
  ],
  [
    { ime: "Dušan Prezelj 153", url: "https://drive.google.com/file/d/1ggp1BYiBZ09SmBWsdOT_cpFiAmKhobu3/preview" },
    { ime: "Dušan Prezelj 145", url: "https://www.youtube.com/embed/I1Hza3OQ1Ig" }
  ],
  [
    { ime: "Stanka Prezelj 186", url: "https://www.youtube.com/embed/Djjc5H9ZRDk" },
    { ime: "Stanka Prezelj 129", url: "https://www.youtube.com/embed/BIVvr8vJNfA" }
  ],
  [
    { ime: "Rožle Prezelj 232", url: "https://www.youtube.com/embed/I3nEu6kVmb4" },
    { ime: "Rožle Prezelj 228", url: "https://www.youtube.com/embed/f06a1I5l_kY" }
  ],
  [
    { ime: "Rožle Prezelj 231", url: "https://www.youtube.com/embed/1wKtuLX-gQo" },
    { ime: "Rožle Prezelj 224", url: "https://www.youtube.com/embed/pqF9p399T3g" }
  ]
];

// Pomožna funkcija: pridobi YouTube ID iz URL-ja
function ytId(url) {
  const m = url.match(/embed\/([\w-]+)/);
  return m ? m[1] : null;
}

// ===== Izris tabele =====
let html = `<table>
  <tr><th>Atlet</th><th>Rekordni skoki</th><th>Atlet</th><th>Rekordni skoki</th></tr>`;

videi.forEach(par => {
  html += "<tr>";
  par.forEach((v, i) => {
    const id = ytId(v.url);
    // YouTube sličica predogleda; za Google Drive -> ozadje z napisom
    const slika = id ? `<img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="${v.ime}">`
                     : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">🎬 Google Drive</div>`;
    html += `
      <td>${v.ime}</td>
      <td>
        <div class="video-gumb" onclick="odpriModal(${JSON.stringify(v.url).replace(/"/g, "&quot;")}, '${v.ime}')">
          ${slika}
          <div class="predvajaj"></div>
          <div class="oznaka">▶ Predvajaj</div>
        </div>
      </td>`;
  });
  html += "</tr>";
});
html += "</table>";
document.getElementById("tabela").innerHTML = html;

// ===== Odpre modalno okno z videom =====
function odpriModal(url, naslov) {
  // YouTube videu dodaj samodejno predvajanje ob odprtju
  let src = url;
  if (ytId(url)) src += (url.includes("?") ? "&" : "?") + "autoplay=1";

  document.getElementById("modalNaslov").textContent = naslov;
  document.getElementById("modalVideo").innerHTML =
    `<iframe src="${src}" frameborder="0" scrolling="no" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  document.getElementById("modal").classList.add("odprt");
  document.body.style.overflow = "hidden"; // prepreči pomikanje ozadja
}

// ===== Zapre modalno okno =====
function zapriModal() {
  document.getElementById("modal").classList.remove("odprt");
  document.getElementById("modalVideo").innerHTML = ""; // odstrani iframe -> ustavi video
  document.body.style.overflow = "";
}

// Klik na temno ozadje zapre modal
function klikOverlay(e) {
  if (e.target.id === "modal") zapriModal();
}

// Tipka ESC zapre modal
document.addEventListener("keydown", e => {
  if (e.key === "Escape") zapriModal();
});
</script>

</body>
</html>
