<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Legende atletike</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #163c69 0%, #081a32 45%, #030b17 100%);
        color: white;
    }

    header {
        text-align: center;
        padding: 35px 20px 25px;
    }

    h1 {
        margin: 0;
        font-size: clamp(34px, 5vw, 62px);
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #ffffff;
        text-shadow: 0 3px 0 #071321, 0 6px 15px rgba(0,0,0,.8);
    }

    .podnaslov {
        margin-top: 12px;
        color: #b9d8f5;
        font-size: 18px;
        letter-spacing: 2px;
    }

    .main {
        width: 94%;
        max-width: 1400px;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 35px;
        padding: 20px 0 50px;
    }

    .athlete {
        position: relative;
        padding: 25px;
        border-radius: 25px;
        background: linear-gradient(145deg, rgba(31,78,121,.85), rgba(4,19,38,.95));
        border: 1px solid rgba(255,255,255,.15);
        box-shadow: 0 20px 45px rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.15);
        transition: .4s;
    }

    .athlete:hover {
        transform: translateY(-7px);
        box-shadow: 0 28px 55px rgba(0,0,0,.7), inset 0 1px 1px rgba(255,255,255,.2);
    }

    .athlete h2 {
        text-align: center;
        font-size: 30px;
        margin: 5px 0 25px;
        letter-spacing: 1px;
        text-shadow: 0 3px 8px black;
    }

    .gallery {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    .photo {
        width: 100%;
        height: 300px;
        object-fit: contain;
        background: #061525;
        border-radius: 18px;
        border: 2px solid rgba(255,255,255,.2);
        box-shadow: 0 12px 25px rgba(0,0,0,.6);
        transition: .4s;
    }

    .photo:hover {
        transform: scale(1.035);
        border-color: rgba(255,255,255,.5);
    }

    .video-btn {
        display: block;
        width: 85%;
        max-width: 400px;
        margin: 28px auto 5px;
        padding: 17px 25px;
        border: none;
        border-radius: 14px;
        font-size: 19px;
        font-weight: bold;
        letter-spacing: 1px;
        color: white;
        background: linear-gradient(145deg, #2678bd, #0d477c);
        cursor: pointer;
        box-shadow: 0 8px 0 #062746, 0 14px 25px rgba(0,0,0,.55), inset 0 1px 2px rgba(255,255,255,.4);
        transition: all .15s ease;
    }

    .video-btn:hover {
        background: linear-gradient(145deg, #3495e5, #12568f);
        transform: translateY(-2px);
        box-shadow: 0 10px 0 #062746, 0 18px 30px rgba(0,0,0,.65), inset 0 1px 3px rgba(255,255,255,.5);
    }

    .video-btn:active {
        transform: translateY(7px);
        box-shadow: 0 2px 0 #062746, 0 5px 10px rgba(0,0,0,.5);
    }

    .modal {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,.88);
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .modal-content {
        position: relative;
        width: 95%;
        max-width: 1100px;
        background: linear-gradient(145deg, #102f52, #040d19);
        border-radius: 22px;
        padding: 18px;
        box-shadow: 0 25px 70px rgba(0,0,0,.9), inset 0 1px 1px rgba(255,255,255,.15);
    }

    .modal-title {
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        margin: 5px 45px 15px;
    }

    .video-container {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%;
        height: 0;
        overflow: hidden;
        border-radius: 14px;
        background: black;
    }

    .video-container video {
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        object-fit: cover;
    }

    .yt-link {
        text-align: center;
        margin-top: 15px;
    }

    .yt-link a {
        color: #7fc8ff;
        font-size: 18px;
        text-decoration: none;
        font-weight: bold;
    }

    .yt-link a:hover {
        text-decoration: underline;
    }

    .close {
        position: absolute;
        right: 15px;
        top: 10px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: none;
        font-size: 25px;
        font-weight: bold;
        color: white;
        background: #9b1c1c;
        cursor: pointer;
        box-shadow: 0 5px 0 #571010, 0 8px 15px rgba(0,0,0,.5);
        transition: .15s;
    }

    .close:hover {
        background: #c52a2a;
        transform: translateY(-2px);
    }

    .close:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #571010;
    }
</style>

</head>

<body>

<header>
<h1>Legende atletike</h1>
<div class="podnaslov">Dušan Košutič • Milan Spasojević</div>
</header>

<main class="main">

<section class="athlete">
    <h2>Dušan Košutič</h2>

    <div class="gallery">
        <img class="photo" src="F:/yt-video/košutič-daljina.JPG">
        <img class="photo" src="F:/yt-video/dušan-k.JPG">
    </div>

    <button class="video-btn"
        onclick="openVideoMP4(
            'Legende Atletike - Dušan Košutić.mp4',
            'Dušan Košutič – video',
            'https://www.youtube.com/watch?v=kEj1hcAeXuI'
        )">
        ▶ Dušan Košutič
    </button>
</section>

<section class="athlete">
    <h2>Milan Spasojević</h2>

    <div class="gallery">
        <img class="photo" src="F:/yt-video/miki-s.JPG">
        <img class="photo" src="F:/yt-video/ms-ok.JPG">
    </div>

    <button class="video-btn"
        onclick="openVideoMP4(
            'Legende Atletike - Milan Spasojević.mp4',
            'Milan Spasojević – video',
            'https://www.youtube.com/watch?v=8s6NLoUebpY'
        )">
        ▶ Milan Spasojević
    </button>
</section>

</main>

<footer>
    <center> 
    <img src ='dp-krog-b.png' width=90 height=auto alt ='Dšan Prezelj' class="round-photo"><br>
    <font size=2><font color = 'orange'>
    Dušan Prezelj ima posnetke v arhivu (Made by Iztok Valenčič)
    </font></center>
</footer>

<!-- MODAL MP4 -->
<div id="videoModal" class="modal">
<div class="modal-content">

    <button class="close" onclick="closeVideo()">×</button>

    <div id="modalTitle" class="modal-title">Video</div>

    <div class="video-container">
        <video id="localVideo" playsinline>
            <source id="videoSource" src="" type="video/mp4">
        </video>
    </div>

    <div class="yt-link">
        <a id="ytLink" href="#" target="_blank">Glej na YouTube</a>
    </div>

</div>
</div>

<script>
function openVideoMP4(fileName, title, ytURL) {

    const modal = document.getElementById("videoModal");
    const video = document.getElementById("localVideo");
    const source = document.getElementById("videoSource");
    const modalTitle = document.getElementById("modalTitle");
    const ytLink = document.getElementById("ytLink");

    source.src = fileName;
    video.load();
    video.play(); // zvok deluje, ker je klik uporabnika

    modalTitle.textContent = title;
    ytLink.href = ytURL;

    modal.style.display = "flex";
    document.body.style.overflow = "hidden";
}

function closeVideo() {

    const modal = document.getElementById("videoModal");
    const video = document.getElementById("localVideo");

    video.pause();
    video.currentTime = 0;

    modal.style.display = "none";
    document.body.style.overflow = "auto";
}

window.onclick = function(event) {
    const modal = document.getElementById("videoModal");
    if (event.target === modal) closeVideo();
};

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") closeVideo();
});
</script>

</body>
</html>
