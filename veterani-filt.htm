<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<title>Registracije – Balkansko prvenstvo Masters 2026</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #0d1b2a;
        color: #e0e6ed;
        margin: 0;
        padding: 20px;
    }
    h1 { margin-bottom: 20px; color: #fff; }
    .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 20px;
        align-items: flex-end;
    }
    .filter-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .filter-row {
        display: flex;
        gap: 4px;
        align-items: center;
    }
    select {
        padding: 6px 10px;
        background: #1b263b;
        color: #fff;
        border: 1px solid #415a77;
        border-radius: 4px;
    }
    .clear-one {
        cursor: pointer;
        padding: 4px 8px;
        background: #e63946;
        border: none;
        border-radius: 4px;
        color: #fff;
        font-size: 12px;
        font-weight: bold;
    }
    .clear-all {
        cursor: pointer;
        padding: 6px 12px;
        background: #e63946;
        border: none;
        border-radius: 4px;
        color: #fff;
        font-weight: bold;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background: #1b263b;
    }
    th, td {
        padding: 8px;
        border-bottom: 1px solid #415a77;
    }
    th {
        background: #415a77;
        color: #fff;
    }
</style>
</head>
<body>

<h1>Registracije – Višina (MOŠKI)</h1>

<div class="filters">
    <div class="filter-group">
        <label for="filterCategory">Kategorija:</label>
        <div class="filter-row">
            <select id="filterCategory">
                <option value="">Vse</option>
            </select>
            <button class="clear-one" onclick="clearOne('filterCategory')">X</button>
        </div>
    </div>

    <div class="filter-group">
        <label for="filterCountry">Država:</label>
        <div class="filter-row">
            <select id="filterCountry">
                <option value="">Vse</option>
            </select>
            <button class="clear-one" onclick="clearOne('filterCountry')">X</button>
        </div>
    </div>

    <div class="filter-group">
        <label for="filterName">Ime:</label>
        <div class="filter-row">
            <select id="filterName">
                <option value="">Vsi</option>
            </select>
            <button class="clear-one" onclick="clearOne('filterName')">X</button>
        </div>
    </div>

    <button class="clear-all" onclick="clearAll()">X počisti vse</button>
</div>

<table id="regTable">
    <thead>
        <tr>
            <th>Kategorija</th>
            <th>#</th>
            <th>Ime / Priimek</th>
            <th>Država</th>
            <th>SB</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
// --- PODATKI (primer; tu lahko zamenjaš z dejanskimi iz strani) ---

    {cat:"M35", no:"1", name:"KAMIS Murat", country:"TUR", sb:""},

    {cat:"M40", no:"3", name:"LACKOVIĆ Boris", country:"CRO", sb:""},
    {cat:"M40", no:"4", name:"ŽALIG Miha", country:"SLO", sb:""},
    {cat:"M45", no:"5", name:"POPOVIĆ Marko", country:"SRB", sb:""},
    {cat:"M45", no:"6", name:"PRELDŽIĆ Alen", country:"CRO", sb:""},
    {cat:"M45", no:"7", name:"TOMOV Nikola", country:"BUL", sb:""},
    {cat:"M45", no:"8", name:"ZDRAVKOV Tsvetan", country:"BUL", sb:""},
    {cat:"M50", no:"9", name:"RUSOV Dragiša", country:"SRB", sb:""},
    {cat:"M55", no:"10", name:"KIROV Konstantin", country:"BUL", sb:""},
    {cat:"M55", no:"11", name:"LAMARIS Nikolaos", country:"GRE", sb:""},
    {cat:"M55", no:"12", name:"MADOUROS Konstantinos", country:"GRE", sb:""},
    {cat:"M55", no:"13", name:"PAPATHEMELIS Michail", country:"GRE", sb:""},
    {cat:"M55", no:"14", name:"RACZ Endre", country:"ROU", sb:""},

    {cat:"M55", no:"16", name:"STANKOVIĆ Aca", country:"SRB", sb:""},

    {cat:"M80", no:"34", name:"VLADIMIROV Vladimir", country:"BUL", sb:""},

];

// --- FILTRI ---
function populateFilters() {
    const catSet = new Set();
    const countrySet = new Set();
    const nameSet = new Set();

    data.forEach(r => {
        catSet.add(r.cat);
        countrySet.add(r.country);
        nameSet.add(r.name);
    });

    fillSelect("filterCategory", catSet);
    fillSelect("filterCountry", countrySet);
    fillSelect("filterName", nameSet);

    // dinamična reakcija na spremembo
    document.getElementById("filterCategory").addEventListener("change", renderTable);
    document.getElementById("filterCountry").addEventListener("change", renderTable);
    document.getElementById("filterName").addEventListener("change", renderTable);
}

function fillSelect(id, set) {
    const sel = document.getElementById(id);
    set.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        sel.appendChild(opt);
    });
}

function clearOne(id) {
    const sel = document.getElementById(id);
    sel.value = "";
    renderTable();
}

function clearAll() {
    ["filterCategory","filterCountry","filterName"].forEach(id => {
        document.getElementById(id).value = "";
    });
    renderTable();
}

// --- TABELA ---
function renderTable() {
    const cat = document.getElementById("filterCategory").value;
    const country = document.getElementById("filterCountry").value;
    const name = document.getElementById("filterName").value;

    const tbody = document.querySelector("#regTable tbody");
    tbody.innerHTML = "";

    data
        .filter(r =>
            (!cat || r.cat === cat) &&
            (!country || r.country === country) &&
            (!name || r.name === name)
        )
        .forEach(r => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${r.cat}</td>
                <td>${r.no}</td>
                <td>${r.name}</td>
                <td>${r.country}</td>
                <td>${r.sb}</td>
            `;
            tbody.appendChild(tr);
        });
}

// inicializacija
populateFilters();
renderTable();
</script>

</body>
</html>
