<!doctype html><html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atletske legende | Arhiv Dušan Košutić</title><style>
:root{color-scheme:dark;--gold:#e8c785;--muted:#aebed3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193458,#071426 68%);color:#f5f7fb;font:16px/1.6 system-ui,Segoe UI,sans-serif;min-height:100vh}header{text-align:center;padding:44px 15px 22px}header .eyebrow{letter-spacing:.35em;color:var(--gold);font-size:.78rem;text-transform:uppercase}h1{font-family:Georgia,serif;font-size:clamp(2.4rem,6vw,5rem);margin:4px 0;color:#fff;letter-spacing:.02em}header p{font-family:Georgia,serif;color:var(--gold);font-size:clamp(1.1rem,2.5vw,1.6rem);margin:0}.line{width:110px;height:2px;background:var(--gold);margin:23px auto}.wrap{max-width:1200px;margin:auto;padding:0 18px 50px}.viewer{position:relative;background:#030915;border:1px solid #51617b;border-radius:18px;overflow:hidden;box-shadow:0 24px 70px #0009}.stage{height:min(66vw,680px);min-height:280px;display:flex;align-items:center;justify-content:center;position:relative}.stage img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:1px solid #ffffff77;background:#071426b8;color:white;font-size:2rem;width:52px;height:62px;border-radius:12px;cursor:pointer}.prev{left:12px}.next{right:12px}.arrow:hover,.btn:hover{background:#37527a}.info{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 22px;background:#10223b;flex-wrap:wrap}.info h2{font-family:Georgia,serif;color:var(--gold);font-size:1.25rem;margin:0}.info p{margin:2px 0;color:var(--muted)}.counter{color:var(--gold);white-space:nowrap}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0}.btn{border:1px solid #637997;background:#183456;color:#fff;border-radius:10px;padding:11px 17px;cursor:pointer;font:inherit}.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.thumb{padding:5px;background:#11243b;border:2px solid transparent;border-radius:12px;cursor:pointer;color:#cdd9e7;text-align:left}.thumb.active{border-color:var(--gold)}.thumb img{width:100%;height:clamp(90px,15vw,165px);object-fit:cover;border-radius:7px}.thumb span{display:block;padding:3px 5px;font-size:.85rem}.foot{text-align:center;color:#a9bbd0;margin:34px 0 0;font-size:.9rem}dialog{background:#030712;border:0;padding:0;max-width:100vw;max-height:100vh;width:100vw;height:100vh}dialog::backdrop{background:#000e}dialog img{width:100%;height:100%;object-fit:contain}dialog button{position:absolute;right:20px;top:15px;background:#142a4a;color:#fff;border:1px solid white;border-radius:9px;padding:9px 15px;cursor:pointer}@media(max-width:600px){.thumbs{grid-template-columns:repeat(2,1fr)}.arrow{width:40px;height:50px;font-size:1.4rem}.stage{min-height:240px}}
</style></head><body><header><div class="eyebrow">Zgodovinski fotografski album</div><h1>Atletske legende</h1><p>Arhiv Dušan Košutić</p><div class="line"></div></header><main class="wrap"><section class="viewer" aria-label="Fotografski album"><div class="stage"><img id="photo" alt="Fotografija iz arhiva Dušana Košutića"><button class="arrow prev" id="prev" aria-label="Prejšnja fotografija">&#10094;</button><button class="arrow next" id="next" aria-label="Naslednja fotografija">&#10095;</button></div><div class="info"><div><h2 id="caption"></h2><p id="description"></p></div><strong class="counter" id="counter"></strong></div></section><div class="controls"><button class="btn" id="play">⏸ Ustavi predvajanje</button><button class="btn" id="fullscreen">⛶ Celozaslonski ogled</button><button class="btn" id="download">↓ Shrani fotografijo</button></div><nav class="thumbs" id="thumbs" aria-label="Izbor fotografij"></nav><p class="foot">ATLETSKE LEGENDE · ARHIV DUŠAN KOŠUTIĆ · Fotografski spomini</p></main><dialog id="lightbox"><img id="zoom" alt="Povečana arhivska fotografija"><button id="close">✕ Zapri (Esc)</button></dialog><script>
const slides=[{src:'images/01-srecanje.jpg',title:'Srečanje atletskih legend',desc:'Skupinska fotografija ob druženju za mizo.'},{src:'images/02-arhivska.png',title:'Spomini iz preteklosti',desc:'Črno-bela arhivska fotografija.'},{src:'images/03-skupina.jpg',title:'Srečanje prijateljev',desc:'Skupinska fotografija v notranjih prostorih.'},{src:'images/04-vrt.jpg',title:'Druženje na prostem',desc:'Skupinska fotografija na vrtni terasi.'}];let current=0,playing=true,timer;const $=id=>document.getElementById(id);function show(i){current=(i+slides.length)%slides.length;const s=slides[current];$('photo').src=s.src;$('photo').alt=s.title;$('caption').textContent=s.title;$('description').textContent=s.desc;$('counter').textContent=`${current+1} / ${slides.length}`;[...$('thumbs').children].forEach((b,j)=>{b.classList.toggle('active',j===current);b.setAttribute('aria-current',j===current?'true':'false')});$('zoom').src=s.src}function start(){clearInterval(timer);if(playing)timer=setInterval(()=>show(current+1),5500)}function toggle(){playing=!playing;$('play').textContent=playing?'⏸ Ustavi predvajanje':'▶ Zaženi predvajanje';start()}slides.forEach((s,i)=>{const b=document.createElement('button');b.className='thumb';b.innerHTML=`<img src="${s.src}" alt=""><span>${i+1}. ${s.title}</span>`;b.onclick=()=>{show(i);start()};$('thumbs').append(b)});$('prev').onclick=()=>{show(current-1);start()};$('next').onclick=()=>{show(current+1);start()};$('play').onclick=toggle;function openZoom(){if(playing)toggle();$('lightbox').showModal()}$('fullscreen').onclick=openZoom;$('photo').onclick=openZoom;$('close').onclick=()=>$('lightbox').close();$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').close()};$('download').onclick=()=>{const a=document.createElement('a');a.href=slides[current].src;a.download=slides[current].src.split('/').pop();a.click()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInterval(timer);else start()});show(0);start();
</script></body></html>
