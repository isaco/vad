
<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<title>AI Megatrend Long-Term Model</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{--bg:#050814;--card:#0b1020;--border:#1c2640;--text:#e5ecff;--muted:#9aa4c6;}
  body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;margin:0;}
  .header{padding:20px;text-align:center;background:#070b18;border-bottom:1px solid var(--border);
          box-shadow:0 10px 30px rgba(0,0,0,0.45);}
  .header h1{margin:0;font-size:1.6rem;}
  .muted{color:var(--muted);font-size:0.9rem;}
  .wrapper{max-width:1200px;margin:0 auto;padding:20px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:18px;margin-top:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;
        box-shadow:0 10px 30px rgba(0,0,0,0.45);animation:fadeIn 0.6s ease;position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at top left,
        rgba(31,111,229,0.18),transparent 55%);opacity:0.7;pointer-events:none;}
  .card h2{margin:0 0 10px;font-size:1rem;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="header">
  <h1>AI Megatrend Long‑Term Model</h1>
  <div class="muted">Dolgotrajna rast AI sektorja, CAPEX, podatkovni centri</div>
</div>
<div class="wrapper">
  <div class="grid">
    <div class="card">
      <h2>📈 AI Index Long‑Term</h2>
      <div class="muted">AI tematski indeks</div>
      <div style="height:300px;margin-top:10px;">
        <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=ai_index&symbol=NASDAQ:BOTZ&interval=W&theme=dark"
                width="100%" height="100%" frameborder="0"></iframe>
      </div>
    </div>
    <div class="card">
      <h2>🏗 CAPEX v podatkovne centre</h2>
      <div class="muted">Investicije v infrastrukturo</div>
      <div style="height:300px;margin-top:10px;">
        <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=capex&symbol=FRED:CAPEX&interval:Q&theme=dark"
                width="100%" height="100%" frameborder="0"></iframe>
      </div>
    </div>
    <div class="card">
      <h2>⚙ Polprevodniki – dolgoročni trend</h2>
      <div class="muted">SOX indeks</div>
      <div style="height:300px;margin-top:10px;">
        <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=sox&symbol=NASDAQ:SOXX&interval=W&theme=dark"
                width="100%" height="100%" frameborder="0"></iframe>
      </div>
    </div>
    <div class="card">
      <h2>📊 AI Adoption Curve</h2>
      <div class="muted">Proxy preko QQQ / XLK</div>
      <div style="height:300px;margin-top:10px;">
        <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=adoption&symbol=NASDAQ:QQQ&interval=W&theme=dark"
                width="100%" height="100%" frameborder="0"></iframe>
      </div>
    </div>
  </div>
</div>
</body>
</html>
