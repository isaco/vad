<html>
<meta charset='utf-8'>
<svg width="100%" height="220" viewBox="0 0 400 220"
     xmlns="http://www.w3.org/2000/svg"
     style="background:#0b1020;border-radius:12px">
  <!-- Grid -->
  <defs>
    <linearGradient id="volGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3ea6ff" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#3ea6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3ea6ff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="intGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#ffb347" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Axes -->
  <line x1="30" y1="180" x2="380" y2="180" stroke="#444b63" stroke-width="1"/>
  <line x1="30" y1="40" x2="30" y2="180" stroke="#444b63" stroke-width="1"/>

  <!-- Volume area (matematično: naraščanje do 2. tedna, nato padec) -->
  <path d="
    M 30 150
    C 90 130 150 110 210 90
    C 270 70 330 90 380 110
    L 380 180
    L 30 180 Z"
    fill="url(#volGrad)" />

  <!-- Intensity area (matematično: nižja na začetku, vrh v 3. tednu, znižanje v taperju) -->
  <path d="
    M 30 130
    C 90 120 150 100 210 70
    C 270 50 330 60 380 80
    L 380 180
    L 30 180 Z"
    fill="url(#intGrad)" />

  <!-- Baseline -->
  <line x1="30" y1="180" x2="380" y2="180" stroke="#2a3148" stroke-width="2"/>

  <!-- Ticks (tedni) -->
  <g fill="#9aa4c6" font-size="10">
    <text x="70"  y="195" text-anchor="middle">Teden 1</text>
    <text x="150" y="195" text-anchor="middle">Teden 2</text>
    <text x="230" y="195" text-anchor="middle">Teden 3</text>
    <text x="310" y="195" text-anchor="middle">Teden 4</text>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#9aa4c6">
    <rect x="40" y="50" width="14" height="14" rx="3" fill="#3ea6ff"/>
    <text x="60" y="61">Volumen</text>
    <rect x="140" y="50" width="14" height="14" rx="3" fill="#ffb347"/>
    <text x="160" y="61">Intenzivnost</text>
  </g>

  <!-- Title -->
  <text x="30" y="25" fill="#e5ecff" font-size="13" font-weight="600">
    Obremenitvene krivulje – 4-tedenski mezocikel (skok v višino)
  </text>
</svg>
</html>
