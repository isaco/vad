<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<title>Pot po dnevih - hoteli</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0b1b3b, #122b5f);
        color: #f5f5f5;
        text-align: center;
        padding: 40px 20px;
    }

    h1 {
        margin-bottom: 30px;
        letter-spacing: 1px;
    }

    .grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
    }

    .btn3d {
        min-width: 160px;
        padding: 15px 25px;
        background: linear-gradient(145deg, #1b3f7a, #274b90);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 10px 0 #0a1733, 0 14px 25px rgba(0,0,0,0.5);
        transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn3d:active {
        transform: translateY(4px);
        box-shadow: 0 6px 0 #0a1733, 0 8px 15px rgba(0,0,0,0.5);
    }

    .sub {
        display: block;
        font-size: 13px;
        opacity: 0.8;
        margin-top: 4px;
    }
</style>

<script>
function odpri(slika) {
    window.open(slika, "_blank");
}
</script>

</head>
<body>

<h1>Pot po dnevih - hoteli</h1>
    <h3><font color='orange'>Made by Anita Valenčič</font></h3>
<p>Izberi dan in odpri sliko (pot, hoteli).</p>

<div class="grid">

    <button class="btn3d" onclick="odpri('zem-d1.jpg')">
        Dan 1
        <span class="sub">zem-d1.jpg</span>
    </button>

    <button class="btn3d" onclick="odpri('zem-d2.jpg')">
        Dan 2
        <span class="sub">zem-d2.jpg</span>
    </button>

    <button class="btn3d" onclick="odpri('zem-d3.jpg')">
        Dan 3
        <span class="sub">zem-d3.jpg</span>
    </button>

    <button class="btn3d" onclick="odpri('zem-d4.jpg')">
        Dan 4
        <span class="sub">zem-d4.jpg</span>
    </button>

    <button class="btn3d" onclick="odpri('zem-d4-3.jpg')">
        Dan 4 – dodatna
        <span class="sub">zem-d4-3.jpg</span>
    </button>

    <button class="btn3d" onclick="odpri('zem-d5.jpg')">
        Dan 5
        <span class="sub">zem-d5.jpg</span>
    </button>

</div>

</body>
</html>
