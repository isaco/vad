<!DOCTYPE html>
<html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minimalni standardi znanja – matematika, 9. razred</title><style>
:root{color-scheme:dark;--bg:#071329;--card:#102344;--line:#29476d;--txt:#eaf2ff;--muted:#a8bddb;--accent:#64d5ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#071329,#0b2040);color:var(--txt);font:16px/1.55 system-ui,Segoe UI,Arial,sans-serif}.wrap{max-width:1160px;margin:auto;padding:32px 20px}header{padding:24px 28px;background:linear-gradient(110deg,#12355c,#102344);border:1px solid var(--line);border-radius:20px}h1{margin:0 0 6px;font-size:clamp(1.5rem,3vw,2.4rem)}p{margin:6px 0;color:var(--muted)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}input,select,button{background:#142c4e;color:#fff;border:1px solid #3c638b;border-radius:10px;padding:12px;font:inherit}input{flex:1;min-width:210px}button{cursor:pointer;background:#12628b}button:hover{background:#197caa}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}table{border-collapse:collapse;width:100%;min-width:700px}thead th{position:sticky;top:0;background:#17385e;text-align:left;padding:15px}tbody td{padding:13px 15px;border-top:1px solid var(--line);vertical-align:top}tbody tr:nth-child(even){background:#0e2341}tbody tr:hover{background:#19395a}th:nth-child(1){width:60px}th:nth-child(2){width:215px}th:nth-child(4){width:145px}.num{color:#7fd8ff;font-weight:700}.count{color:var(--muted);margin:12px 0}.check{width:19px;height:19px;accent-color:#50c8a0;cursor:pointer}.note{font-size:.85rem;color:var(--muted)}@media print{body{background:white;color:black}.wrap{max-width:none;padding:0}header{background:white;border:none}p,.count{color:#333}.toolbar,.note{display:none}table{min-width:0}thead th{background:#eee;color:#000}tbody tr:nth-child(even),tbody tr:hover{background:#f5f5f5}td,th{border:1px solid #aaa;color:black}.num{color:black}}
</style></head><body><main class="wrap"><header><h1>Minimalni standardi znanja – matematika</h1><p>9. razred osnovne šole · preglednica po priloženem seznamu</p></header><div class="toolbar"><input id="search" type="search" placeholder="Išči po standardih ali področjih …" aria-label="Iskanje"><select id="area" aria-label="Področje"><option value="">Vsa področja</option></select><button id="reset">Počisti filtre</button><button onclick="window.print()">Natisni / PDF</button><button id="csv">Izvozi CSV</button></div><div class="count" id="count"></div><div class="tablewrap"><table><thead><tr><th>Št.</th><th>Področje</th><th>Minimalni standard znanja – učenec …</th><th>Označi usvojeno</th></tr></thead><tbody id="rows"></tbody></table></div>

<script>
const standards=[
['Algebra','množi dvočlenik z dvočlenikom, kvadrira dvočlenik in poenostavi izraz,'],
['Algebra','izpostavi skupni faktor v algebrskem izrazu,'],
['Enačbe','prepozna linearno enačbo in jo reši s preoblikovanjem v ekvivalentne enačbe,'],
['Formule','izrazi neznanko iz matematičnih formul,'],
['Sorazmerja','reši besedilno nalogo z uporabo lastnosti premega sorazmerja,'],
['Sorazmerja','nariše graf premega sorazmerja,'],
['Funkcije','prepozna zapis linearne funkcije, pozna vlogo smernega koeficienta in začetne vrednosti,'],
['Funkcije','nariše graf linearne funkcije,'],
['Sorazmerja','izračuna neznani člen sorazmerja,'],
['Geometrija – podobnost','prepozna podobne like,'],
['Geometrija – podobnost','načrtuje podobne trikotnike,'],
['Geometrija – podobnost','daljico deli v zahtevanem razmerju,'],
['Geometrija – prostor','opiše medsebojno lego geometrijskih elementov v prostoru, (točka, premica, ravnina),'],
['Geometrija – telesa','prepozna, opiše in skicira geometrijska telesa,'],
['Geometrija – telesa','izračuna površino in prostornino prizme, valja in stožca,'],
['Statistika','pripravi in izvede anketo ter rezultate prikaže in interpretira,'],
['Uporabna matematika','reši matematični problem in problem z življenjsko situacijo.']
];
const $=id=>document.getElementById(id);const areas=[...new Set(standards.map(x=>x[0]))];areas.forEach(a=>{let o=document.createElement('option');o.value=a;o.textContent=a;$('area').append(o)});let done={};try{done=JSON.parse(localStorage.getItem('ms9_done')||'{}')}catch{};
function render(){const q=$('search').value.trim().toLocaleLowerCase('sl'),a=$('area').value;const found=standards.map((s,i)=>({s,i})).filter(({s})=>(!a||s[0]===a)&&(!q||s.join(' ').toLocaleLowerCase('sl').includes(q)));$('rows').replaceChildren();for(const {s,i} of found){const tr=document.createElement('tr');const n=document.createElement('td');n.className='num';n.textContent=i+1;const cat=document.createElement('td');cat.textContent=s[0];const st=document.createElement('td');st.textContent=s[1];const c=document.createElement('td');const cb=document.createElement('input');cb.type='checkbox';cb.className='check';cb.checked=!!done[i];cb.setAttribute('aria-label','Usvojeno: '+s[1]);cb.addEventListener('change',()=>{done[i]=cb.checked;try{localStorage.setItem('ms9_done',JSON.stringify(done))}catch{};updateCount()});c.append(cb);tr.append(n,cat,st,c);$('rows').append(tr)}updateCount(found.length)}function updateCount(visible){$('count').textContent=`Prikazanih standardov: ${visible??$('rows').children.length} od ${standards.length} · Usvojenih: ${standards.filter((_,i)=>done[i]).length} od ${standards.length}`}$('search').addEventListener('input',render);$('area').addEventListener('change',render);$('reset').addEventListener('click',()=>{$('search').value='';$('area').value='';render()});$('csv').addEventListener('click',()=>{const esc=x=>'"'+String(x).replaceAll('"','""')+'"';const lines=[['Št.','Področje','Minimalni standard','Usvojeno'],...standards.map((s,i)=>[i+1,...s,done[i]?'DA':'NE'])].map(r=>r.map(esc).join(';')).join('\r\n');const blob=new Blob(['\uFEFF'+lines],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='minimalni_standardi_matematika_9_razred.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});render();
</script></body></html>
