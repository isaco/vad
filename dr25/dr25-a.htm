<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Državni veteranski rekordi</title>
<style>
:root{--blue:#173f73;--blue2:#2463a6;--light:#eef4fb;--line:#d9e2ec;--text:#17212b}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#f5f7fa}
header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;padding:26px 20px}
header .wrap{max-width:1250px;margin:auto}
h1{margin:0 0 6px;font-size:28px} .sub{opacity:.9}
main{max-width:1250px;margin:18px auto;padding:0 14px}
.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 3px 12px #0000000d}
.filters{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px}
label{font-size:12px;font-weight:bold;color:#536273;display:block;margin-bottom:5px}
select,input{width:100%;padding:10px;border:1px solid #bcc9d6;border-radius:8px;background:white;font-size:14px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0 8px;flex-wrap:wrap}
.count{font-weight:bold;color:var(--blue)} button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer}
.reset{background:#e8eef5;color:#18324d} .print{background:var(--blue);color:white}
.tablebox{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;table-layout:fixed;background:white}
th{position:sticky;top:0;background:#eaf1f8;color:#173f73;text-align:left;font-size:13px;padding:10px;border-bottom:2px solid #b9c9d9}
td{padding:8px 7px;border-bottom:1px solid #e6ebf0;font-size:13px;vertical-align:top;overflow-wrap:anywhere}
tr:hover td{background:#f7fbff}
th:nth-child(1),td:nth-child(1){width:10%}
th:nth-child(2),td:nth-child(2){width:6%;text-align:center}
th:nth-child(3),td:nth-child(3){width:13%}
th:nth-child(4),td:nth-child(4){width:18%}
th:nth-child(5),td:nth-child(5){width:14%}
th:nth-child(6),td:nth-child(6){width:10%;white-space:nowrap}
th:nth-child(7),td:nth-child(7){width:10%;white-space:nowrap}
th:nth-child(8),td:nth-child(8){width:13%}
th:nth-child(9),td:nth-child(9){width:6%;text-align:center;white-space:nowrap}

.rec{font-weight:bold;color:#0b4f8a}
.missing{color:#9a5a00;font-style:italic}
footer{max-width:1250px;margin:15px auto 30px;padding:0 14px;color:#697786;font-size:12px}
@media(max-width:800px){.filters{grid-template-columns:1fr 1fr} h1{font-size:22px} table{min-width:900px;table-layout:fixed}}
@media(max-width:520px){.filters{grid-template-columns:1fr}}
@media print{header{background:white;color:black;padding:10px 0} .panel{box-shadow:none;border:0;padding:0} .filters,.actions button{display:none} main{max-width:none} .tablebox{overflow:visible;border:0} table{min-width:0} th{position:static} body{background:white}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Državni veteranski rekordi
&nbsp; <font size=2><font color='orange'>Made by Iztok & Anita Valenčič</font>
</h1>
 <div class="sub">Pregled rekordov 2025 – dvorana in na prostem</div></div></header>
<main>
<div class="panel">
<div class="filters">
<div><label>Okolje</label><select id="okolje"><option value="">Vse</option></select></div>
<div><label>Skupina</label><select id="skupina"><option value="">Vsi</option></select></div>
<div><label>Kategorija</label><select id="kategorija"><option value="">Vse</option></select></div>
<div><label>Disciplina</label><select id="disciplina"><option value="">Vse</option></select></div>
<div><label>Iskanje</label><input id="q" placeholder="Ime, klub, kraj ..."></div>
</div>
<div class="actions"><div class="count" id="count"></div><div><button class="reset" id="reset">Počisti filtre</button> <button class="print" onclick="window.print()">Natisni</button></div></div>
<div class="tablebox">
<table>
<thead><tr><th>Okolje</th><th>Kat.</th><th>Disciplina</th><th>Priimek in ime</th><th>Klub</th><th>Rekord</th><th>Datum</th><th>Kraj</th><th>Starost</th></tr></thead>
<tbody id="body"></tbody>
</table>
</div></div>
</main>
<footer>Vir podatkov: priložena preglednica državnih veteranskih rekordov. Starost je izračunana na dan doseženega rekorda.</footer>
