<html>
<meta charset='utf-8'>
<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1920" fill="#0F2A44"/>

  <!-- Title -->
  <text x="540" y="140" text-anchor="middle" fill="#FFFFFF"
        font-family="Montserrat, Arial" font-size="40" font-weight="800">
    NACIONALNI KONCEPT PROSTOVOLJSTVA
  </text>
  <text x="540" y="190" text-anchor="middle" fill="#FFFFFF"
        font-family="Inter, Arial" font-size="22">
    Civilnodružbeni predlog 2030/2035
  </text>

  <!-- Divider -->
  <line x1="260" y1="220" x2="820" y2="220" stroke="#1B9CFC" stroke-width="3"/>

  <!-- Three columns block -->
  <!-- Column 1: Temeljna načela -->
  <g transform="translate(80,280)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Montserrat" font-size="24" font-weight="600">
      Temeljna načela
    </text>
    <text x="0" y="40" fill="#FFFFFF" font-family="Inter" font-size="18">• Solidarnost</text>
    <text x="0" y="70" fill="#FFFFFF" font-family="Inter" font-size="18">• Medgeneracijsko sodelovanje</text>
    <text x="0" y="100" fill="#FFFFFF" font-family="Inter" font-size="18">• Strokovnost</text>
    <text x="0" y="130" fill="#FFFFFF" font-family="Inter" font-size="18">• Stabilnost</text>
    <text x="0" y="160" fill="#FFFFFF" font-family="Inter" font-size="18">• Partnerstvo</text>
    <text x="0" y="190" fill="#FFFFFF" font-family="Inter" font-size="18">• Transparentnost</text>
  </g>

  <!-- Column 2: Ključni stebri -->
  <g transform="translate(400,280)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Montserrat" font-size="24" font-weight="600">
      Ključni stebri
    </text>
    <text x="0" y="40" fill="#FFFFFF" font-family="Inter" font-size="18">
      • Organiziranost (lokalno–regijsko–nacionalno)
    </text>
    <text x="0" y="70" fill="#FFFFFF" font-family="Inter" font-size="18">
      • Standardi in kompetence
    </text>
    <text x="0" y="100" fill="#FFFFFF" font-family="Inter" font-size="18">
      • Digitalna platforma
    </text>
    <text x="0" y="130" fill="#FFFFFF" font-family="Inter" font-size="18">
      • Stabilno financiranje
    </text>
    <text x="0" y="160" fill="#FFFFFF" font-family="Inter" font-size="18">
      • Merjenje učinkov
    </text>
  </g>

  <!-- Column 3: Partnerski model -->
  <g transform="translate(720,280)">
    <text x="0" y="0" fill="#FFFFFF" font-family="Montserrat" font-size="24" font-weight="600">
      Partnerski model
    </text>
    <text x="0" y="40" fill="#FFFFFF" font-family="Inter" font-size="18">
      • Občine: lokalni koordinator
    </text>
    <text x="0" y="70" fill="#FFFFFF" font-family="Inter" font-size="18">
      • Regije: regijski centri
    </text>
    <text x="0" y="100" fill="#FFFFFF" font-family="Inter" font-size="18">
      • Država: Nacionalni svet
    </text>
    <text x="0" y="130" fill="#FFFFFF" font-family="Inter" font-size="18">
      • Protokoli sodelovanja
    </text>
    <text x="0" y="160" fill="#FFFFFF" font-family="Inter" font-size="18">
      • Sistemski pogoji
    </text>
  </g>

  <!-- Central card: Zakaj civilna družba -->
  <g transform="translate(140,620)">
    <rect x="0" y="0" width="800" height="220" rx="16" fill="#123456" stroke="#1B9CFC" stroke-width="2"/>
    <text x="400" y="40" text-anchor="middle" fill="#FFFFFF"
          font-family="Montserrat" font-size="24" font-weight="600">
      Zakaj civilna družba definira koncept?
    </text>
    <text x="60" y="90" fill="#FFFFFF" font-family="Inter" font-size="18">
      • Ker pozna potrebe, izzive in prakse na terenu.
    </text>
    <text x="60" y="120" fill="#FFFFFF" font-family="Inter" font-size="18">
      • Ker je prostovoljstvo njen temeljni prostor delovanja.
    </text>
    <text x="60" y="150" fill="#FFFFFF" font-family="Inter" font-size="18">
      • Ker lahko postavi standarde, ki jih država sprejme.
    </text>
  </g>

  <!-- 7 strategic goals row -->
  <g transform="translate(80,920)">
    <!-- Each circle: 7 goals -->
    <g transform="translate(0,0)">
      <circle cx="60" cy="60" r="40" fill="#1B9CFC"/>
      <text x="60" y="65" text-anchor="middle" fill="#FFFFFF"
            font-family="Inter" font-size="14">Organiziranost</text>
    </g>
    <g transform="translate(150,0)">
      <circle cx="60" cy="60" r="40" fill="#55E6C1"/>
      <text x="60" y="65" text-anchor="middle" fill="#0F2A44"
            font-family="Inter" font-size="14">Profesionalizacija</text>
    </g>
    <g transform="translate(300,0)">
      <circle cx="60" cy="60" r="40" fill="#1B9CFC"/>
      <text x="60" y="65" text-anchor="middle" fill="#FFFFFF"
            font-family="Inter" font-size="14">Digitalizacija</text>
    </g>
    <g transform="translate(450,0)">
      <circle cx="60" cy="60" r="40" fill="#55E6C1"/>
      <text x="60" y="65" text-anchor="middle" fill="#0F2A44"
            font-family="Inter" font-size="14">Financiranje</text>
    </g>
    <g transform="translate(600,0)">
      <circle cx="60" cy="60" r="40" fill="#1B9CFC"/>
      <text x="60" y="65" text-anchor="middle" fill="#FFFFFF"
            font-family="Inter" font-size="14">Partnerstvo</text>
    </g>
    <g transform="translate(750,0)">
      <circle cx="60" cy="60" r="40" fill="#55E6C1"/>
      <text x="60" y="55" text-anchor="middle" fill="#0F2A44"
            font-family="Inter" font-size="13">Medgeneracijsko</text>
      <text x="60" y="72" text-anchor="middle" fill="#0F2A44"
            font-family="Inter" font-size="13">prostovoljstvo</text>
    </g>
  </g>

  <!-- Last goal centered below -->
  <g transform="translate(420,1040)">
    <circle cx="120" cy="60" r="40" fill="#1B9CFC"/>
    <text x="120" y="65" text-anchor="middle" fill="#FFFFFF"
          font-family="Inter" font-size="14">Merjenje učinkov</text>
  </g>

  <!-- Footer -->
  <text x="80" y="1180" fill="#FFFFFF" font-family="Inter" font-size="16">
    Civilnodružbeni predlog – verzija za razpravo
  </text>
</svg>
<p>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#0F2A44"/>

  <!-- Title -->
  <text x="960" y="90" text-anchor="middle" fill="#FFFFFF"
        font-family="Montserrat" font-size="38" font-weight="800">
    STRATEŠKI CILJI RAZVOJA PROSTOVOLJSTVA 2030/2035
  </text>

  <!-- Grid of cards 3x3 (7 used) -->
  <!-- Card style: rounded rect + icon circle + text -->

  <!-- Card 1: Organiziranost -->
  <g transform="translate(160,160)">
    <rect x="0" y="0" width="480" height="220" rx="18" fill="#123456" stroke="#1B9CFC" stroke-width="2"/>
    <circle cx="60" cy="60" r="26" fill="#1B9CFC"/>
    <text x="110" y="65" fill="#FFFFFF" font-family="Montserrat" font-size="22" font-weight="600">
      Organiziranost
    </text>
    <text x="40" y="110" fill="#FFFFFF" font-family="Inter" font-size="18">
      Vzpostaviti jasen model koordinacije prostovoljstva
    </text>
    <text x="40" y="140" fill="#FFFFFF" font-family="Inter" font-size="18">
      na lokalni, regijski in nacionalni ravni.
    </text>
  </g>

  <!-- Card 2: Profesionalizacija -->
  <g transform="translate(720,160)">
    <rect x="0" y="0" width="480" height="220" rx="18" fill="#123456" stroke="#1B9CFC" stroke-width="2"/>
    <circle cx="60" cy="60" r="26" fill="#55E6C1"/>
    <text x="110" y="65" fill="#FFFFFF" font-family="Montserrat" font-size="22" font-weight="600">
      Profesionalizacija
    </text>
    <text x="40" y="110" fill="#FFFFFF" font-family="Inter" font-size="18">
      Uvesti standarde, kompetenčne modele in sistem
    </text>
    <text x="40" y="140" fill="#FFFFFF" font-family="Inter" font-size="18">
      usposabljanj za prostovoljce in organizacije.
    </text>
  </g>

  <!-- Card 3: Digitalizacija -->
  <g transform="translate(1280,160)">
    <rect x="0" y="0" width="480" height="220" rx="18" fill="#123456" stroke="#1B9CFC" stroke-width="2"/>
    <circle cx="60" cy="60" r="26" fill="#1B9CFC"/>
    <text x="110" y="65" fill="#FFFFFF" font-family="Montserrat" font-size="22" font-weight="600">
      Digitalizacija
    </text>
    <text x="40" y="110" fill="#FFFFFF" font-family="Inter" font-size="18">
      Vzpostaviti nacionalno digitalno platformo za
    </text>
    <text x="40" y="140" fill="#FFFFFF" font-family="Inter" font-size="18">
      prostovoljstvo, povezano z občinami in organizacijami.
    </text>
  </g>

  <!-- Card 4: Stabilno financiranje -->
  <g transform="translate(160,420)">
    <rect x="0" y="0" width="480" height="220" rx="18" fill="#123456" stroke="#1B9CFC" stroke-width="2"/>
    <circle cx="60" cy="60" r="26" fill="#55E6C1"/>
    <text x="110" y="65" fill="#FFFFFF" font-family="Montserrat" font-size="22" font-weight="600">
      Stabilno financiranje
    </text>
    <text x="40" y="110" fill="#FFFFFF" font-family="Inter" font-size="18">
      Uvesti večletne finančne mehanizme, ki omogočajo
    </text>
    <text x="40" y="140" fill="#FFFFFF" font-family="Inter" font-size="18">
      stabilno delovanje organizacij.
    </text>
  </g>

  <!-- Card 5: Partnerski model -->
  <g transform="translate(720,420)">
    <rect x="0" y="0" width="480" height="220" rx="18" fill="#123456" stroke="#1B9CFC" stroke-width="2"/>
    <circle cx="60" cy="60" r="26" fill="#1B9CFC"/>
    <text x="110" y="65" fill="#FFFFFF" font-family="Montserrat" font-size="22" font-weight="600">
      Partnerski model z državo
    </text>
    <text x="40" y="110" fill="#FFFFFF" font-family="Inter" font-size="18">
      Vzpostaviti formalne protokole sodelovanja med
    </text>
    <text x="40" y="140" fill="#FFFFFF" font-family="Inter" font-size="18">
      civilno družbo in državo.
    </text>
  </g>

  <!-- Card 6: Medgeneracijsko prostovoljstvo -->
  <g transform="translate(1280,420)">
    <rect x="0" y="0" width="480" height="220" rx="18" fill="#123456" stroke="#1B9CFC" stroke-width="2"/>
    <circle cx="60" cy="60" r="26" fill="#55E6C1"/>
    <text x="110" y="65" fill="#FFFFFF" font-family="Montserrat" font-size="22" font-weight="600">
      Medgeneracijsko prostovoljstvo
    </text>
    <text x="40" y="110" fill="#FFFFFF" font-family="Inter" font-size="18">
      Krepiti sodelovanje med mladimi, odraslimi in
    </text>
    <text x="40" y="140" fill="#FFFFFF" font-family="Inter" font-size="18">
      starejšimi kot ključno razvojno področje.
    </text>
  </g>

  <!-- Card 7: Merjenje učinkov (center bottom) -->
  <g transform="translate(720,680)">
    <rect x="0" y="0" width="480" height="220" rx="18" fill="#123456" stroke="#1B9CFC" stroke-width="2"/>
    <circle cx="60" cy="60" r="26" fill="#1B9CFC"/>
    <text x="110" y="65" fill="#FFFFFF" font-family="Montserrat" font-size="22" font-weight="600">
      Merjenje učinkov
    </text>
    <text x="40" y="110" fill="#FFFFFF" font-family="Inter" font-size="18">
      Vzpostaviti sistem kazalnikov, ki meri družbeni,
    </text>
    <text x="40" y="140" fill="#FFFFFF" font-family="Inter" font-size="18">
      socialni, zdravstveni in gospodarski učinek prostovoljstva.
    </text>
  </g>
</svg>
</html>
