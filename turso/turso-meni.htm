<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>Turso Navigacijski Meni</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 50px; 
            background: linear-gradient(135deg, #f4f6f9 0%, #e4e9f0 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .menu-container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            width: 450px; 
            text-align: center; 
        }
        h2 { color: #0056b3; margin-bottom: 25px; }
        
        .menu-list { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        
        .menu-link { 
            display: block; 
            padding: 12px 20px; 
            background-color: #f8f9fa; 
            color: #0056b3; 
            text-decoration: none; 
            border: 1px solid #dee2e6; 
            border-radius: 6px; 
            font-weight: bold; 
            transition: all 0.2s ease-in-out; 
        }
        
        .menu-link:hover { 
            background-color: #007bff; 
            color: white; 
            transform: translateY(-2px); 
            box-shadow: 0 4px 8px rgba(0,123,255,0.2); 
        }

        /* Poseben slog za 3D gumb */
        .btn-3d { 
            background: linear-gradient(145deg, #28a745, #218838); 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            box-shadow: 0 4px 6px rgba(40, 167, 69, 0.3); 
            transition: all 0.2s ease; 
            margin-top: 10px; 
        }
        
        .btn-3d:hover { 
            background: linear-gradient(145deg, #218838, #1e7e34); 
            box-shadow: 0 6px 12px rgba(40, 167, 69, 0.4); 
            transform: translateY(-2px); 
        }

        .btn-3d:active { 
            transform: translateY(1px); 
            box-shadow: 0 2px 4px rgba(40, 167, 69, 0.4); 
        }
    </style>
</head>
<body>

<div class="menu-container">
    <h2>VAD DB - Meni</h2>
    <h4>Made by Iztok Valenčič</h4>
    
    <div class="menu-list">
        <!-- Povezava do upravljanja (aplikacije) -->
        <a href="turso-atleti-app.htm" target='_blank' class="menu-link">
            📊 Upravljanje Atletov (App)
        </a>
        
        <!-- Povezava do pogleda (vjuja) -->
        <a href="turso-vju-atleti-f.html" target='_blank' class="menu-link">
            👁️ Pogled Atletov (View)
        </a>

        <!-- Gumb 3D, ki odpre novo okno z izbrano povezavo -->
        <button class="btn-3d" onclick="odpri3DOkno()">
            🌐 Drugo Okno
        </button>
    </div>
</div>

<script>
    function odpri3DOkno() {
        // Tukaj lahko vnesete katerikoli ciljni URL, ki se naj odpre v novem oknu
        const ciljnaPovezava = "turso-atleti-app.htm"; 
        
        // Funkcija window.open odpre novo okno/zavihek z nastavitvami dimenzij
        window.open(
            ciljnaPovezava, 
            "_blank", 
            "width=1200,height=800,menubar=no,toolbar=no,location=no,status=no"
        );
    }
</script>

</body>
</html>
