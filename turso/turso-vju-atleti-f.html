<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAD Ljubljana – številke veteranov</title>
<style>
:root{color-scheme:dark;--bg:#071327;--panel:#102442;--border:#294466;--text:#e9f2ff;--accent:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17365c,#071327 65%);color:var(--text);font-family:Segoe UI,Arial,sans-serif;min-height:100vh;padding:32px 18px}.container{max-width:1200px;margin:auto}header{text-align:center;margin-bottom:25px}h1{margin:0;color:#93c5fd;font-size:clamp(1.6rem,4vw,2.5rem)}header p{color:#a7c3e6}.panel{background:rgba(16,36,66,.95);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 15px 45px #0005;margin-bottom:20px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:14px;align-items:end}.field label{display:block;margin-bottom:7px;font-size:.88rem;color:#bcd6f5}.control{display:flex;gap:5px}.field input,.field select{width:100%;background:#081b35;border:1px solid #45638a;color:white;padding:12px;border-radius:9px;font:inherit;min-width:0}.field input:focus,.field select:focus{outline:2px solid #60a5fa}button{border:1px solid #5278a8;background:#1d4675;color:white;border-radius:9px;padding:11px 14px;cursor:pointer;font:inherit}button:hover{background:#2865a7}.clear{padding:9px 12px}.primary{background:#2563eb;border-color:#3b82f6;white-space:nowrap}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 0}.stat{background:#071b35;border:1px solid #27496f;padding:12px 18px;border-radius:11px;min-width:135px}.stat strong{font-size:1.5rem;color:#93c5fd;display:block}.stat span{font-size:.82rem;color:#b8cce4}.table-wrap{overflow:auto;border-radius:12px;border:1px solid #2c4b70}table{width:100%;border-collapse:collapse;min-width:650px}th{background:#174777;color:#fff;text-align:left;padding:15px 14px;cursor:pointer;white-space:nowrap}th:hover{background:#21639e}td{padding:13px 14px;border-bottom:1px solid #29415e}tbody tr:nth-child(even){background:#142e50}tbody tr:hover{background:#24496e}.num{font-weight:750;font-variant-numeric:tabular-nums;color:#b6dcff}.tag{display:inline-block;border-radius:30px;background:#244d78;padding:4px 11px;font-size:.85rem}.female{background:#56365f;color:#f5c9fb}.male{background:#204d70;color:#bfe7ff}.status{margin-top:13px;color:#b9cce5;font-size:.9rem}.error{color:#ffb4b4}footer{text-align:center;color:#92aac9;margin-top:26px;font-size:.85rem}@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.primary{width:100%}}@media(max-width:520px){.filters{grid-template-columns:1fr}body{padding:15px 10px}}
</style>
</head>
<body><main class="container">
<header><h1>VAD Ljubljana – številke veteranov</h1><p>Interaktivni pregled članov in njihovih številk</p></header>
<section class="panel"><div class="filters">
<div class="field"><label for="name">Veteran – iskanje po imenu</label><div class="control"><input id="name" type="search" placeholder="Vnesi ime ali priimek ..."><button class="clear" data-clear="name" title="Počisti ime">×</button></div></div>
<div class="field"><label for="number">ID_št</label><div class="control"><input id="number" type="search" inputmode="numeric" placeholder="npr. 1003"><button class="clear" data-clear="number" title="Počisti številko">×</button></div></div>
<div class="field"><label for="sex">Spol</label><select id="sex"><option value="">Vsi</option><option value="M">Moški (1000+)</option><option value="Ž">Ženske (&lt; 100)</option></select></div>
<button id="reset" class="primary">↺ Počisti vse filtre</button>
</div><div class="stats"><div class="stat"><strong id="found">–</strong><span>Najdenih zapisov</span></div><div class="stat"><strong id="total">–</strong><span>Vseh veteranov</span></div><div class="stat"><strong id="men">–</strong><span>Moški med zadetki</span></div><div class="stat"><strong id="women">–</strong><span>Ženske med zadetki</span></div></div><div class="status" id="status" role="status">Nalagam atleti.csv ...</div></section>
<section class="panel"><div class="table-wrap"><table><thead><tr><th data-sort="id">ID ↕</th><th data-sort="veteran">Veteran ↕</th><th data-sort="stevilka">ID_št ↕</th><th data-sort="spol">Spol ↕</th><th data-sort="opombe">Opombe ↕</th></tr></thead><tbody id="body"><tr><td colspan="5">Nalagam ...</td></tr></tbody></table></div></section><footer>Vir: atleti.csv (ista mapa kot HTML) · UTF-8 · VAD Ljubljana</footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);let records=[],sortKey='stevilka',sortDir=1;
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false; text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function gender(n){return Number(n)>1000?'M':Number(n)<100?'Ž':'–'}
function fmt(n){return n===''?'':String(n).padStart(4,'0')}
function normalized(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('sl')}
function td(tr,value,cls=''){const el=document.createElement('td');el.textContent=value;if(cls)el.className=cls;tr.append(el);return el}
function render(){const q=normalized($('name').value.trim()),n=$('number').value.trim(),sex=$('sex').value;const filtered=records.filter(r=>(!q||normalized(r.veteran).includes(q))&&(!n||String(r.stevilka).includes(n)||fmt(r.stevilka).includes(n))&&(!sex||r.spol===sex));filtered.sort((a,b)=>{const va=a[sortKey],vb=b[sortKey];return sortDir*(sortKey==='id'||sortKey==='stevilka'?Number(va)-Number(vb):String(va).localeCompare(String(vb),'sl',{numeric:true}))});$('found').textContent=filtered.length;$('total').textContent=records.length;$('men').textContent=filtered.filter(r=>r.spol==='M').length;$('women').textContent=filtered.filter(r=>r.spol==='Ž').length;const body=$('body');body.replaceChildren();if(!filtered.length){const tr=document.createElement('tr');td(tr,'Ni najdenih zapisov.').colSpan=5;body.append(tr)}else{const frag=document.createDocumentFragment();filtered.forEach(r=>{const tr=document.createElement('tr');td(tr,r.id);td(tr,r.veteran);td(tr,fmt(r.stevilka),'num');const s=td(tr,r.spol==='M'?'Moški':r.spol==='Ž'?'Ženska':'Neopredeljeno');s.className=r.spol==='M'?'male':r.spol==='Ž'?'female':'';td(tr,r.opombe);frag.append(tr)});body.append(frag)}$('status').textContent=`Prikaz: ${filtered.length} od ${records.length} zapisov. Klik na naslov stolpca razvrsti podatke.`}
async function load(){try{const response=await fetch('./atleti.csv',{cache:'no-store'});if(!response.ok)throw Error(`HTTP ${response.status}`);const data=parseCSV(await response.text());if(data.length<2)throw Error('CSV je prazen');const headers=data.shift().map(x=>x.trim().toLocaleLowerCase('sl'));const find=(...names)=>headers.findIndex(h=>names.includes(h));const ix={id:find('id'),veteran:find('veteran'),stevilka:find('številka','stevilka'),opombe:find('opombae','opombe')};if(ix.veteran<0||ix.stevilka<0)throw Error('Manjkata stolpca veteran ali številka');records=data.map(row=>({id:row[ix.id]??'',veteran:row[ix.veteran]??'',stevilka:row[ix.stevilka]??'',opombe:row[ix.opombe]??''})).filter(r=>r.veteran||r.stevilka).map(r=>({...r,spol:gender(r.stevilka)}));render()}catch(e){$('body').innerHTML='<tr><td colspan="5">Podatkov ni mogoče naložiti.</td></tr>';$('status').className='status error';$('status').textContent=`Napaka: ${e.message}. Datoteki HTML in atleti.csv morata biti v isti mapi; odpri stran prek http://localhost/turso-data/ (ne file://).`}}
['name','number','sex'].forEach(id=>$(id).addEventListener(id==='sex'?'change':'input',render));document.querySelectorAll('[data-clear]').forEach(b=>b.addEventListener('click',()=>{$(b.dataset.clear).value='';render();$(b.dataset.clear).focus()}));$('reset').addEventListener('click',()=>{['name','number','sex'].forEach(id=>$(id).value='');render()});document.querySelectorAll('th[data-sort]').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.sort;sortDir=sortKey===k?-sortDir:1;sortKey=k;render()}));load();
</script></body></html>
