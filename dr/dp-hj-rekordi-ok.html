<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <title>Dušan Prezelj - svetovni prvak in rekorder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url('dp.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-shadow: 1px 1px 2px black;
    }
    .overlay {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 2rem;
      border-radius: 10px;
    }
    table {
      background-color: rgba(255, 255, 255, 0.9);
      color: black;
    }
    canvas {
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      padding: 1rem;
      max-width: 100%;
      height: 300px !important;
    }
  </style>
</head>
<body>
  <div class="container mt-4 overlay">
    <h1 class="text-center mb-4">
    <img src='dp-krog-b.png' width=100 height=auto' alt='Dušan'>
    <font color='red'>Dušan Prezelj </font> - <font color='gold'>svetovni prvak in rekorder</font>
    
    </h1>

    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Kat</th>
          <th>Leta</th>
          <th>Rezultat</th>
          <th>Datum</th>
          <th>Lokacija</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>M40</td><td>40</td><td>2,01</td><td>27.07.1989</td><td>Eugene</td></tr>
        <tr><td>M45</td><td>45</td><td>1,9</td><td>11.06.1994</td><td>Atene</td></tr>
        <tr><td>M60</td><td>62</td><td>1,76</td><td>15.09.2011</td><td>Lignano</td></tr>
        <tr><td>M65</td><td>66</td><td>1,67</td><td>22.08.2015</td><td>Izmir</td></tr>
        <tr><td>M70</td><td>71</td><td>1,6</td><td>22,07.2020</td><td>Ptuj</td></tr>
        <tr><td>M75</td><td>75</td><td>1,53</td><td>02.03.2024</td><td>Zagreb</td></tr>
        <tr><td>M75</td><td>75</td><td>1,45</td><td>13.08.2024</td><td>Gothenburg</td></tr>
      </tbody>
    </table>

    <h4 class="text-center mt-4 mb-3">Graf rezultatov po datumih</h4>
    <div class="d-flex justify-content-center">
      <canvas id="grafRezultatov" width="600" height="300"></canvas>
    </div>
  </div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const ctx = document.getElementById('grafRezultatov').getContext('2d');
    const graf = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [
          '27.07.1989', '11.06.1994', '15.09.2011',
          '22.08.2015', '22.07.2020', '02.03.2024', '13.08.2024'
        ],
        datasets: [{
          label: 'Rezultat',
          data: [2.01, 1.9, 1.76, 1.67, 1.6, 1.53, 1.45],
          fill: false,
          borderColor: 'rgba(255, 99, 132, 1)',
          backgroundColor: 'rgba(255, 99, 132, 0.2)',
          tension: 0.3,
          pointRadius: 4,
          pointHoverRadius: 6,
          pointBackgroundColor: 'rgba(255, 99, 132, 1)',
          pointHoverBackgroundColor: 'yellow'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          tooltip: {
            callbacks: {
              label: function(context) {
                const index = context.dataIndex;
                const dodatniPodatki = [
                  'M40, 40 let, Eugene',
                  'M45, 45 let, Atene',
                  'M60, 62 let, Lignano',
                  'M65, 66 let, Izmir',
                  'M70, 71 let, Ptuj',
                  'M75, 75 let, Zagreb',
                  'M75, 75 let, Gothenburg'
                ];
                return `Rezultat: ${context.raw} (${dodatniPodatki[index]})`;
              }
            }
          }
        },
        scales: {
          y: {
            title: {
              display: true,
              text: 'Rezultat (m)'
            }
          },
          x: {
            title: {
              display: true,
              text: 'Datum'
            }
          }
        }
      }
    });
  </script>
</body>
</html>
